  - title: "Lab 1 - SBOM, VEX, SLSA"
    contentPath: 03-sbom-vex-slsa.md
  - title: "Lab 2 - Start From a Trusted Base"
    contentPath: 04-dhi-migration.md
  - title: "Lab 3 - Sign It, Then Gate It"
    contentPath: 05-ci-policy.md
  - title: "Lab 4 - Securing the Agentic Stack"
    contentPath: 06-mcp-dhi.md
  - title: Conclusion
    contentPath: 07-conclusion.md

# $$name$$ in markdown is replaced with these values. `org` is overridden by the
# :variableDefinition prompt in Setup.
variables:
  org: demo-org
  dhiPrefix: "dhi.io/"
