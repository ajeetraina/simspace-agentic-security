<g opacity="0.55"><rect x="1370" y="285" width="150" height="150" rx="12" fill="#20293f"/><text x="1386" y="318" font-size="15" font-weight="800" fill="#5b6b8c" letter-spacing="1">INVOKE</text><text x="1386" y="348" font-size="17" font-weight="700" fill="#8a97b4">Agent / MCP</text><text x="1386" y="374" font-size="13.5" fill="#6b789a">client</text><text x="1386" y="393" font-size="13.5" fill="#6b789a">signed, read-only</text></g>
<g stroke="#64748B" stroke-width="2.5" fill="#64748B">
<line x1="264" y1="360" x2="286" y2="360"/><polygon points="286,354 298,360 286,366"/>
<line x1="466" y1="360" x2="488" y2="360"/><polygon points="488,354 500,360 488,366"/>
<line x1="668" y1="360" x2="690" y2="360"/><polygon points="690,354 702,360 690,366"/>
<line x1="870" y1="360" x2="951" y2="360"/><polygon points="951,354 963,360 951,366"/>
