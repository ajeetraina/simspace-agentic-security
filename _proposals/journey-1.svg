<g opacity="0.55"><rect x="292" y="285" width="172" height="150" rx="12" fill="#20293f"/><text x="308" y="318" font-size="15" font-weight="800" fill="#5b6b8c" letter-spacing="1">BASE</text><text x="308" y="348" font-size="17" font-weight="700" fill="#8a97b4">Hardened image</text><text x="308" y="374" font-size="13.5" fill="#6b789a">DHI · 0 CVEs</text><text x="308" y="393" font-size="13.5" fill="#6b789a">SLSA L3</text></g>
<g><rect x="494" y="285" width="172" height="150" rx="12" fill="#0b1533" stroke="#1a7f37" stroke-width="3"/><text x="510" y="318" font-size="15" font-weight="800" fill="#7da2ff" letter-spacing="1">BUILD</text><text x="510" y="348" font-size="17" font-weight="700" fill="#ffffff">Buildx</text><text x="510" y="374" font-size="13.5" fill="#9aa6c2">SBOM + provenance</text><text x="510" y="393" font-size="13.5" fill="#9aa6c2">attached at build</text><circle cx="642" cy="309" r="15" fill="#1a7f37"/><path d="M635,309 l5,6 l9,-11" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
