<text x="1135" y="345" text-anchor="middle" font-size="12" font-weight="800" fill="#1a7f37">pass</text>
<g opacity="0.4"><rect x="55" y="500" width="1050" height="66" rx="12" fill="#FDECEA" stroke="#F0B4AE" stroke-width="1.5"/>
<text x="80" y="528" font-size="15" font-weight="800" fill="#B91C1C">UNGOVERNED BASELINE — what the agent shipped on your host</text>
<text x="80" y="552" font-size="14" fill="#8A1C13">FROM node:20 · 431 pkgs · no SBOM · root · nothing you can prove</text></g>
<text x="1130" y="524" font-size="15" font-weight="800" fill="#0B1533">1 / 4 stages provable</text>
<rect x="1130" y="540" width="96" height="20" rx="10" fill="#1a7f37"/>
<text x="1178.0" y="592" text-anchor="middle" font-size="13" font-weight="700" fill="#14532D">Lab 1</text>
<rect x="1238" y="540" width="96" height="20" rx="10" fill="#c3cbe4"/>
<text x="1286.0" y="592" text-anchor="middle" font-size="13" font-weight="700" fill="#8a93b4">Lab 2</text>
<rect x="1346" y="540" width="96" height="20" rx="10" fill="#c3cbe4"/>
<text x="1394.0" y="592" text-anchor="middle" font-size="13" font-weight="700" fill="#8a93b4">Lab 3</text>
<rect x="1454" y="540" width="96" height="20" rx="10" fill="#c3cbe4"/>
<text x="1502.0" y="592" text-anchor="middle" font-size="13" font-weight="700" fill="#8a93b4">Lab 4</text>
<rect x="55" y="640" width="1495" height="96" rx="16" fill="#0B1533"/>
<text x="80" y="682" font-size="20" font-weight="800" fill="#FFFFFF">Same discipline at both ends — the agent that BUILDS runs in a box; the service it BECOMES runs in a box.</text>
<text x="80" y="714" font-size="16" fill="#C7D2FE">sbx microVM at authoring time · read_only + cap_drop ALL at runtime. Least privilege on the left and the right of the road.</text>
</svg>