<g opacity="0.55"><rect x="955" y="250" width="150" height="205" rx="16" fill="#efe4d2" stroke="#d97706" stroke-width="3"/><text x="1030.0" y="292" text-anchor="middle" font-size="18" font-weight="800" fill="#9a3412">CI GATE</text><text x="1030.0" y="322" text-anchor="middle" font-size="12.5" fill="#9a3412">no critical CVEs</text><text x="1030.0" y="343" text-anchor="middle" font-size="12.5" fill="#9a3412">SBOM present</text><text x="1030.0" y="364" text-anchor="middle" font-size="12.5" fill="#9a3412">provenance verified</text><line x1="985" y1="380" x2="1075" y2="380" stroke="#e6b98a" stroke-width="1.5"/><text x="1030.0" y="406" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">FAIL CLOSED</text><text x="1030.0" y="430" text-anchor="middle" font-size="11.5" fill="#9a3412">dev → prod boundary</text></g>
<rect x="1170" y="150" width="380" height="330" rx="18" fill="#E6F4EA" stroke="#1a7f37" stroke-width="2.5" stroke-dasharray="9 7" opacity="0.8"/>
