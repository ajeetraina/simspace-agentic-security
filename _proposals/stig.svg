<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<rect x="95" y="92" width="48" height="48" rx="12" fill="#EDE9FE"/>
<path d="M119,101 L131,106 L131,116 Q131,127 119,132 Q107,127 107,116 L107,106 Z" fill="#7C3AED"/>
<path d="M119,111 v9 M114.5,115.5 h9" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
<text x="160" y="132" font-size="46" font-weight="800" fill="#0B1533">STIG</text>
<text x="95" y="205" font-size="21" fill="#64748B">Security Technical Implementation Guide - DoD hardening standard</text>
<text x="95" y="260" font-size="20" fill="#334155">STIGs define secure configuration baselines published by DISA</text>
<text x="95" y="291" font-size="20" fill="#334155">for DoD environments. DISA has not yet published a</text>
<text x="95" y="322" font-size="20" fill="#334155">container-specific STIG - Docker creates custom profiles based</text>
<text x="95" y="353" font-size="20" fill="#334155">on the <tspan font-weight="800" fill="#0B1533">GPOS SRG + DoD Container Hardening Process Guide.</tspan></text>
<path d="M96,406 l6,7 l12,-15" stroke="#16A34A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="420" font-size="19" fill="#0B1533">DHI ships signed STIG scan attestations</text>
<path d="M96,458 l6,7 l12,-15" stroke="#16A34A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="472" font-size="19" fill="#0B1533">Reduces false positives common in container STIG scans</text>
<path d="M96,510 l6,7 l12,-15" stroke="#16A34A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="524" font-size="19" fill="#0B1533">STIG variant requires a Docker subscription</text>
<rect x="975" y="160" width="555" height="560" rx="14" fill="#0B1220"/>
<text x="1003" y="206" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#7FE0A0"># Inspect the signed STIG attestation</text>
<text x="1003" y="233" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#FFFFFF">docker scout attest get \</text>
<text x="1003" y="260" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#FFFFFF">  --predicate-type https://docker.com/dhi/stig/v0.1 \</text>
<text x="1003" y="287" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#FFFFFF">  --verify \</text>
<text x="1003" y="314" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#FFFFFF">  dhi.io/node:24-debian13-fips</text>
<text x="1003" y="368" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#7FE0A0"># View all attestations on a DHI image</text>
<text x="1003" y="395" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#FFFFFF">docker scout attest list \</text>
<text x="1003" y="422" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#FFFFFF">  dhi.io/node:24-debian13</text>
<text x="1003" y="476" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#7FE0A0"># Attestation types you'll see:</text>
<text x="1003" y="503" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#7FE0A0"># SBOM · OpenVEX · SLSA · FIPS · STIG</text>
<text x="1003" y="530" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#7FE0A0"># Scout health · Secrets scan</text>
</svg>