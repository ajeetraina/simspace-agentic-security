<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<rect x="95" y="92" width="48" height="48" rx="12" fill="#E7EFFE"/>
<rect x="110" y="116" width="18" height="14" rx="2.5" fill="#1E40AF"/>
<path d="M113,116 L113,111 A6,6 0 0 1 125,111 L125,116" stroke="#1E40AF" stroke-width="2.6" fill="none"/>
<text x="160" y="132" font-size="46" font-weight="800" fill="#0B1533">FIPS 140</text>
<text x="95" y="205" font-size="21" fill="#64748B">Federal Information Processing Standard - validated cryptography</text>
<text x="95" y="262" font-size="20" fill="#334155">FIPS 140 mandates that cryptographic modules meet NIST-validated</text>
<text x="95" y="293" font-size="20" fill="#334155">standards. Required for US government contracts, healthcare</text>
<text x="95" y="324" font-size="20" fill="#334155">(HIPAA), finance, and defense workloads.</text>
<path d="M96,396 l6,7 l12,-15" stroke="#16A34A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="410" font-size="19" fill="#0B1533">DHI ships a <tspan font-family="Courier New, monospace" fill="#1E40AF">-fips</tspan> tag variant per image</text>
<path d="M96,448 l6,7 l12,-15" stroke="#16A34A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="462" font-size="19" fill="#0B1533">OpenSSL FIPS Provider - CMVP validated</text>
<path d="M96,500 l6,7 l12,-15" stroke="#16A34A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="514" font-size="19" fill="#0B1533">Signed FIPS attestation - machine-readable for auditors</text>
<rect x="975" y="160" width="555" height="560" rx="14" fill="#0B1220"/>
<text x="1003" y="206" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#7FE0A0"># Pull the FIPS variant</text>
<text x="1003" y="233" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#FFFFFF">FROM dhi.io/node:24-debian13-fips</text>
<text x="1003" y="287" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#7FE0A0"># Inspect the signed FIPS attestation</text>
<text x="1003" y="314" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#FFFFFF">docker scout attest get \</text>
<text x="1003" y="341" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#FFFFFF">  --predicate-type https://docker.com/dhi/fips/v0.1 \</text>
<text x="1003" y="368" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#FFFFFF">  --verify \</text>
<text x="1003" y="395" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#FFFFFF">  dhi.io/node:24-debian13-fips</text>
<text x="1003" y="449" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#7FE0A0"># Output shows certification details:</text>
<text x="1003" y="476" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#7FE0A0"># "standard": "FIPS 140-3"</text>
<text x="1003" y="503" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#7FE0A0"># "certification": "CMVP #4985"</text>
<text x="1003" y="530" font-size="15" font-family="Courier New, monospace" xml:space="preserve" fill="#7FE0A0"># "status": "active"</text>
</svg>