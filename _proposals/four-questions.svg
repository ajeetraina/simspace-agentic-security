<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="70" y="92" font-size="42" font-weight="800" fill="#0B1533">Every agent-driven change answers four questions</text>
<text x="70" y="134" font-size="22" fill="#64748B">Four layers that make agent-driven change governable - before we walk the road.</text>
<g><rect x="70" y="210" width="344" height="470" rx="14" fill="#F7F9FF" stroke="#E2E8F8" stroke-width="1.5"/><text x="96" y="276" font-size="52" font-weight="800" fill="#C7D0EA">1</text><text x="96" y="320" font-size="15" font-weight="800" fill="#2563EB" letter-spacing="1">EVIDENCE</text><text x="96" y="360" font-size="21" font-weight="700" fill="#0B1533">What is in this, and</text><text x="96" y="388" font-size="21" font-weight="700" fill="#0B1533">where did it come from?</text><text x="96" y="638" font-size="13.5" fill="#5B6B8C">SBOM · VEX · SLSA</text><text x="96" y="658" font-size="13.5" fill="#5B6B8C">provenance</text></g>
<g><rect x="442" y="210" width="344" height="470" rx="14" fill="#F7F9FF" stroke="#E2E8F8" stroke-width="1.5"/><text x="468" y="276" font-size="52" font-weight="800" fill="#C7D0EA">2</text><text x="468" y="320" font-size="15" font-weight="800" fill="#2563EB" letter-spacing="1">BASELINE</text><text x="468" y="360" font-size="21" font-weight="700" fill="#0B1533">Did it start from</text><text x="468" y="388" font-size="21" font-weight="700" fill="#0B1533">something trustworthy?</text><text x="468" y="638" font-size="13.5" fill="#5B6B8C">Docker Hardened</text><text x="468" y="658" font-size="13.5" fill="#5B6B8C">Images</text></g>
<g><rect x="814" y="210" width="344" height="470" rx="14" fill="#F7F9FF" stroke="#E2E8F8" stroke-width="1.5"/><text x="840" y="276" font-size="52" font-weight="800" fill="#C7D0EA">3</text><text x="840" y="320" font-size="15" font-weight="800" fill="#2563EB" letter-spacing="1">GATE</text><text x="840" y="360" font-size="21" font-weight="700" fill="#0B1533">Is it allowed</text><text x="840" y="388" font-size="21" font-weight="700" fill="#0B1533">to pass?</text><text x="840" y="638" font-size="13.5" fill="#5B6B8C">Build policies · signing</text><text x="840" y="658" font-size="13.5" fill="#5B6B8C">· admission</text></g>
<g><rect x="1186" y="210" width="344" height="470" rx="14" fill="#F7F9FF" stroke="#E2E8F8" stroke-width="1.5"/><text x="1212" y="276" font-size="52" font-weight="800" fill="#C7D0EA">4</text><text x="1212" y="320" font-size="15" font-weight="800" fill="#2563EB" letter-spacing="1">BOUNDARY</text><text x="1212" y="360" font-size="21" font-weight="700" fill="#0B1533">What could it reach</text><text x="1212" y="388" font-size="21" font-weight="700" fill="#0B1533">while it worked?</text><text x="1212" y="638" font-size="13.5" fill="#5B6B8C">Sandbox runtime · network,</text><text x="1212" y="658" font-size="13.5" fill="#5B6B8C">filesystem, credentials</text></g>
<text x="70" y="748" font-size="22" font-weight="800" fill="#0B1533">Evidence and baseline make governance possible. <tspan fill="#2563EB">Gate and boundary make it real.</tspan></text>
</svg>